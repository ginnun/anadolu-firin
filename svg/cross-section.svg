<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%"><defs><pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#C2703E"></rect><rect x="0" y="0" width="11" height="5" fill="#B5623A" rx="0.5"></rect><rect x="13" y="0" width="11" height="5" fill="#D4825A" rx="0.5"></rect><rect x="6" y="7" width="11" height="5" fill="#B5623A" rx="0.5"></rect></pattern><pattern id="stone" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#9E9080"></rect><circle cx="5" cy="5" r="3" fill="#8B8070"></circle><circle cx="15" cy="15" r="4" fill="#A89E8E"></circle></pattern></defs><text x="350" y="24" text-anchor="middle" font-family="Playfair Display,serif" font-size="16" font-weight="700" fill="#3D2B1F">Fırın Kesit Görünümü (Yan)</text><rect x="50" y="380" width="600" height="80" fill="#E0D5C5" rx="4"></rect><text x="350" y="425" text-anchor="middle" font-size="12" fill="#8B7355">Zemin</text><rect x="120" y="340" width="460" height="40" fill="#B0A898" stroke="#8B8070" rx="3"></rect><text x="350" y="365" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Betonarme Temel (10-15 cm)</text><rect x="120" y="200" width="40" height="140" fill="url(#stone)" stroke="#8B8070"></rect><rect x="540" y="200" width="40" height="140" fill="url(#stone)" stroke="#8B8070"></rect><rect x="160" y="260" width="380" height="80" fill="url(#stone)" opacity="0.5"></rect><text x="350" y="305" text-anchor="middle" font-size="10" fill="#5C4033">Taş ve Çakıl Dolgu</text><rect x="120" y="240" width="460" height="20" fill="#B0A898" stroke="#8B8070"></rect><text x="350" y="254" text-anchor="middle" font-size="9" fill="#fff">Beton Tabla</text><rect x="160" y="225" width="380" height="15" fill="#A8C8D8" stroke="#80B0C0" stroke-width="0.5"></rect><text x="560" y="236" font-size="9" fill="#5B7BA3" font-weight="600">← Cam Kırığı</text><rect x="160" y="215" width="380" height="10" fill="#E8DDD0" strok